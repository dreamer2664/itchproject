<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delve — Procedural Dungeon Map Generator</title>
<style>
  :root{
    --bg:#14121a; --panel:#1d1a26; --panel2:#241f30; --line:#332c44;
    --ink:#e8e3f3; --dim:#9a91b0; --accent:#c8a2ff; --accent2:#7de0c0;
    --warn:#ffb86b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:12px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  header h1{font-size:15px; margin:0; letter-spacing:.4px; font-weight:650}
  header h1 span{color:var(--accent)}
  header .tag{color:var(--dim); font-size:12px}
  header .spacer{flex:1}
  main{display:flex; flex:1; min-height:0}
  aside{
    width:264px; flex:0 0 264px; background:var(--panel);
    border-right:1px solid var(--line); overflow-y:auto; padding:14px;
  }
  .group{margin-bottom:18px}
  .group h2{
    font-size:11px; text-transform:uppercase; letter-spacing:1.1px;
    color:var(--dim); margin:0 0 9px; font-weight:600;
  }
  label{display:block; margin-bottom:11px}
  label .row{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
  label .name{color:var(--ink); font-size:12.5px}
  label .val{color:var(--accent2); font-variant-numeric:tabular-nums; font-size:12px}
  input[type=range]{width:100%; margin:4px 0 0; accent-color:var(--accent)}
  select,input[type=text]{
    width:100%; background:var(--panel2); color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; font-size:12.5px;
  }
  input[type=text]{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .checks label{display:flex; align-items:center; gap:8px; font-size:12.5px; cursor:pointer}
  .checks input{accent-color:var(--accent); width:15px; height:15px; margin:0}
  button{
    background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:6px; padding:7px 10px; font:inherit; font-size:12.5px; cursor:pointer;
    transition:background .12s,border-color .12s;
  }
  button:hover{background:#2d2740; border-color:#453a5e}
  button.primary{background:var(--accent); color:#1a1226; border-color:var(--accent); font-weight:650}
  button.primary:hover{background:#d8baff}
  .btnrow{display:grid; grid-template-columns:1fr 1fr; gap:7px}
  .btnrow.full{grid-template-columns:1fr}
  #stage{flex:1; position:relative; min-width:0; background:#0e0c13}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab}
  canvas:active{cursor:grabbing}
  #hud{
    position:absolute; left:12px; bottom:12px; display:flex; gap:8px; flex-wrap:wrap;
    pointer-events:none;
  }
  .pill{
    background:rgba(29,26,38,.9); border:1px solid var(--line); border-radius:999px;
    padding:4px 11px; font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums;
  }
  .pill b{color:var(--ink); font-weight:600}
  #toast{
    position:absolute; top:12px; left:50%; transform:translateX(-50%) translateY(-8px);
    background:var(--accent2); color:#0d1a16; padding:7px 14px; border-radius:6px;
    font-size:12.5px; font-weight:600; opacity:0; transition:.25s; pointer-events:none;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .note{color:var(--dim); font-size:11.5px; margin-top:8px; line-height:1.45}
  code{background:var(--panel2); padding:1px 4px; border-radius:3px; font-size:11.5px}
  @media (max-width:720px){ aside{width:200px; flex-basis:200px} }
</style>
</head>
<body>
<header>
  <h1>DELVE <span>·</span> dungeon map generator</h1>
  <span class="tag">procedural · deterministic · no assets, no network</span>
  <span class="spacer"></span>
  <span class="tag" id="msTag"></span>
</header>

<main>
<aside>
  <div class="group">
    <h2>Seed</h2>
    <label>
      <input type="text" id="seed" spellcheck="false" autocomplete="off">
      <div class="note">Same seed = same dungeon. Share it to reproduce exactly.</div>
    </label>
    <div class="btnrow">
      <button id="randomize">Random</button>
      <button id="copySeed">Copy</button>
    </div>
  </div>

  <div class="group">
    <h2>Layout</h2>
    <label><div class="row"><span class="name">Grid width</span><span class="val" id="wV"></span></div>
      <input type="range" id="w" min="32" max="160" step="4" value="72"></label>
    <label><div class="row"><span class="name">Grid height</span><span class="val" id="hV"></span></div>
      <input type="range" id="h" min="24" max="120" step="4" value="48"></label>
    <label><div class="row"><span class="name">Rooms</span><span class="val" id="roomsV"></span></div>
      <input type="range" id="rooms" min="4" max="40" step="1" value="14"></label>
    <label><div class="row"><span class="name">Room size</span><span class="val" id="rsizeV"></span></div>
      <input type="range" id="rsize" min="4" max="16" step="1" value="7"></label>
    <label><div class="row"><span class="name">Room variance</span><span class="val" id="rvarV"></span></div>
      <input type="range" id="rvar" min="0" max="10" step="1" value="4"></label>
    <label><div class="row"><span class="name">Corridor width</span><span class="val" id="cwV"></span></div>
      <input type="range" id="cw" min="1" max="4" step="1" value="2"></label>
    <label><div class="row"><span class="name">Loop corridors</span><span class="val" id="loopsV"></span></div>
      <input type="range" id="loops" min="0" max="10" step="1" value="3"></label>
  </div>

  <div class="group">
    <h2>Style</h2>
    <label><div class="row"><span class="name">Palette</span></div>
      <select id="style">
        <option value="ink">Ink on parchment</option>
        <option value="blueprint">Blueprint</option>
        <option value="slate">Slate (dark)</option>
        <option value="mono">Mono (tile-ready)</option>
      </select></label>
    <div class="checks">
      <label><input type="checkbox" id="optDoors" checked> Doors</label>
      <label><input type="checkbox" id="optStairs" checked> Stairs</label>
      <label><input type="checkbox" id="optProps" checked> Props &amp; rubble</label>
      <label><input type="checkbox" id="optGrid" checked> Grid lines</label>
      <label><input type="checkbox" id="optLabels"> Room labels</label>
    </div>
  </div>

  <div class="group">
    <h2>Generate</h2>
    <div class="btnrow full">
      <button class="primary" id="gen">Generate dungeon</button>
    </div>
  </div>

  <div class="group">
    <h2>Export</h2>
    <div class="btnrow">
      <button id="png">PNG</button>
      <button id="png2">PNG @2x</button>
      <button id="json">Tiles JSON</button>
      <button id="csv">Tiles CSV</button>
    </div>
    <div class="note">
      Tile exports give you a <code>W×H</code> grid of integers:<br>
      0 void · 1 floor · 2 wall · 3 corridor · 4 door · 5 stairs · 6 prop
    </div>
  </div>
</aside>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
    <span class="pill">rooms <b id="sRooms">0</b></span>
    <span class="pill">tiles <b id="sTiles">0</b></span>
    <span class="pill">doors <b id="sDoors">0</b></span>
    <span class="pill">scroll to zoom · drag to pan</span>
  </div>
  <div id="toast"></div>
</div>
</main>

<script>
"use strict";
/* -------------------------------------------------------------------------
   Deterministic PRNG (mulberry32) seeded from a string hash (cyrb128).
   No Math.random anywhere in generation -- a seed fully determines output.
   ------------------------------------------------------------------------- */
function cyrb128(str){
  let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
  for(let i=0,k;i<str.length;i++){
    k=str.charCodeAt(i);
    h1=h2^Math.imul(h1^k,597399067);
    h2=h3^Math.imul(h2^k,2869860233);
    h3=h4^Math.imul(h3^k,951274213);
    h4=h1^Math.imul(h4^k,2716044179);
  }
  h1=Math.imul(h3^(h1>>>18),597399067);
  h2=Math.imul(h4^(h2>>>22),2869860233);
  h3=Math.imul(h1^(h3>>>17),951274213);
  h4=Math.imul(h2^(h4>>>19),2716044179);
  return [(h1^h2^h3^h4)>>>0,(h2^h1)>>>0,(h3^h1)>>>0,(h4^h1)>>>0];
}
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function rngFromSeed(seed){ const h=cyrb128(String(seed)); return mulberry32(h[0]); }

/* Seed words so "Random" gives memorable, shareable seeds. */
const ADJ=["grim","hollow","sunken","brazen","withered","gilded","silent","crimson",
  "forgotten","obsidian","brine","ashen","verdant","frozen","cursed","lucky",
  "whispering","iron","glass","molten","pale","thorned","drowned","radiant"];
const NOUN=["vault","crypt","hollow","keep","spire","depths","warren","catacomb",
  "sanctum","barrow","cistern","ossuary","bastion","labyrinth","sepulcher",
  "foundry","archive","menagerie","reliquary","undercroft"];
function randomSeed(r){
  const rnd=r||Math.random;
  const a=ADJ[Math.floor(rnd()*ADJ.length)];
  const n=NOUN[Math.floor(rnd()*NOUN.length)];
  return `${a}-${n}-${Math.floor(rnd()*9000+1000)}`;
}

/* -------------------------------------------------------------------------
   Tile constants
   ------------------------------------------------------------------------- */
const T={VOID:0,FLOOR:1,WALL:2,CORRIDOR:3,DOOR:4,STAIRS:5,PROP:6};

/* -------------------------------------------------------------------------
   Generation
   ------------------------------------------------------------------------- */
function generate(opts){
  const {W,H,roomCount,roomSize,roomVar,corridorW,loops,seed} = opts;
  const rnd = rngFromSeed(seed);
  const ri = (a,b)=>Math.floor(rnd()*(b-a+1))+a;

  const grid = new Uint8Array(W*H);              // T.VOID everywhere
  const idx = (x,y)=>y*W+x;
  const inb = (x,y)=>x>=0&&y>=0&&x<W&&y<H;

  // ---- 1. rooms via rejection sampling -------------------------------
  const rooms=[];
  const PAD=2;
  let attempts=0, maxAttempts=roomCount*220;
  while(rooms.length<roomCount && attempts<maxAttempts){
    attempts++;
    const rw = ri(Math.max(3,roomSize-roomVar), roomSize+roomVar);
    const rh = ri(Math.max(3,roomSize-roomVar), roomSize+roomVar);
    const rx = ri(PAD, W-rw-PAD-1);
    const ry = ri(PAD, H-rh-PAD-1);
    if(rx<1||ry<1||rx+rw>=W-1||ry+rh>=H-1) continue;

    // reject if it overlaps an existing room (plus 1 tile of breathing room)
    let clash=false;
    for(const o of rooms){
      if(rx-1 < o.x+o.w && rx+rw+1 > o.x && ry-1 < o.y+o.h && ry+rh+1 > o.y){ clash=true; break; }
    }
    if(clash) continue;
    rooms.push({x:rx,y:ry,w:rw,h:rh,cx:Math.floor(rx+rw/2),cy:Math.floor(ry+rh/2),id:rooms.length});
  }

  // carve floors
  for(const r of rooms)
    for(let y=r.y;y<r.y+r.h;y++)
      for(let x=r.x;x<r.x+r.w;x++)
        grid[idx(x,y)]=T.FLOOR;

  // ---- 2. connect rooms: MST (Prim) so every room is reachable --------
  function carveH(x1,x2,y,w){
    for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)
      for(let dy=0;dy<w;dy++) if(inb(x,y+dy)) grid[idx(x,y+dy)]=T.CORRIDOR;
  }
  function carveV(y1,y2,x,w){
    for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)
      for(let dx=0;dx<w;dx++) if(inb(x+dx,y)) grid[idx(x+dx,y)]=T.CORRIDOR;
  }
  function connect(a,b,w){
    // L-shaped corridor, elbow direction randomised for variety
    if(rnd()<0.5){ carveH(a.cx,b.cx,a.cy,w); carveV(a.cy,b.cy,b.cx,w); }
    else         { carveV(a.cy,b.cy,a.cx,w); carveH(a.cx,b.cx,b.cy,w); }
  }

  const inTree=[0], out=rooms.map((_,i)=>i).filter(i=>i!==0);
  const edges=[];
  while(out.length && rooms.length>1){
    let best=null,bd=Infinity;
    for(const i of inTree) for(const j of out){
      const d=Math.abs(rooms[i].cx-rooms[j].cx)+Math.abs(rooms[i].cy-rooms[j].cy);
      if(d<bd){bd=d;best=[i,j];}
    }
    if(!best) break;
    connect(rooms[best[0]],rooms[best[1]],corridorW);
    edges.push(best);
    inTree.push(best[1]);
    out.splice(out.indexOf(best[1]),1);
  }

  // ---- 3. extra loops so the map isn't a pure tree --------------------
  for(let k=0;k<loops && rooms.length>3;k++){
    const i=ri(0,rooms.length-1);
    let j=ri(0,rooms.length-1), guard=0;
    while(j===i && guard++<20) j=ri(0,rooms.length-1);
    if(j!==i) connect(rooms[i],rooms[j],corridorW);
  }

  // corridors must not leave floor orphaned; rooms re-stamped on top
  for(const r of rooms)
    for(let y=r.y;y<r.y+r.h;y++)
      for(let x=r.x;x<r.x+r.w;x++)
        grid[idx(x,y)]=T.FLOOR;

  // ---- 4. walls: any void tile touching a walkable tile becomes wall --
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(grid[idx(x,y)]!==T.VOID) continue;
    let touch=false;
    for(let dy=-1;dy<=1&&!touch;dy++) for(let dx=-1;dx<=1;dx++){
      const nx=x+dx, ny=y+dy;
      if(!inb(nx,ny)) continue;
      const t=grid[idx(nx,ny)];
      if(t===T.FLOOR||t===T.CORRIDOR||t===T.DOOR||t===T.STAIRS){ touch=true; break; }
    }
    if(touch) grid[idx(x,y)]=T.WALL;
  }

  // ---- 5. doors: corridor tiles on a room's perimeter -----------------
  // Rooms are re-stamped over corridors in step 3, so a corridor tile never
  // touches a wall. Doorways are therefore exactly the corridor tiles that
  // sit one step outside a room's rectangle -- that's where you enter a room.
  const doorSpots=[];
  const isCorr=(x,y)=>inb(x,y)&&grid[idx(x,y)]===T.CORRIDOR;
  for(const r of rooms){
    for(let x=r.x;x<r.x+r.w;x++){
      if(isCorr(x,r.y-1))    doorSpots.push([x,r.y-1]);
      if(isCorr(x,r.y+r.h))  doorSpots.push([x,r.y+r.h]);
    }
    for(let y=r.y;y<r.y+r.h;y++){
      if(isCorr(r.x-1,y))    doorSpots.push([r.x-1,y]);
      if(isCorr(r.x+r.w,y))  doorSpots.push([r.x+r.w,y]);
    }
  }
  // thin them out, and never let two doors sit directly adjacent
  const doors=[];
  const used=new Set();
  for(const [x,y] of doorSpots){
    const k=x+","+y;
    if(used.has(k)) continue;
    used.add(k);
    if(rnd()>=0.6) continue;
    let adj=false;
    for(const [dx,dy] of doors)
      if(Math.abs(dx-x)+Math.abs(dy-y)<=1){ adj=true; break; }
    if(adj) continue;
    grid[idx(x,y)]=T.DOOR;
    doors.push([x,y]);
  }

  // ---- 6. stairs: two far-apart floor tiles ---------------------------
  const stairs=[];
  if(rooms.length>=2){
    const a=rooms[0], b=rooms[rooms.length-1];
    const pa=[a.x+ri(0,a.w-1), a.y+ri(0,a.h-1)];
    const pb=[b.x+ri(0,b.w-1), b.y+ri(0,b.h-1)];
    grid[idx(pa[0],pa[1])]=T.STAIRS; stairs.push(pa);
    grid[idx(pb[0],pb[1])]=T.STAIRS; stairs.push(pb);
  }

  // ---- 7. props: rubble/feature tiles inside rooms, never blocking ----
  const props=[];
  for(const r of rooms){
    const n = ri(0, Math.max(0,Math.floor(r.w*r.h/18)));
    for(let k=0;k<n;k++){
      const x=ri(r.x+1,r.x+r.w-2), y=ri(r.y+1,r.y+r.h-2);
      if(!inb(x,y)) continue;
      if(grid[idx(x,y)]!==T.FLOOR) continue;
      grid[idx(x,y)]=T.PROP; props.push([x,y]);
    }
  }

  // ---- 8. stats -------------------------------------------------------
  let walkable=0;
  for(let i=0;i<grid.length;i++){
    const t=grid[i];
    if(t===T.FLOOR||t===T.CORRIDOR||t===T.DOOR||t===T.STAIRS) walkable++;
  }

  return {grid,W,H,rooms,doors,stairs,props,walkable,seed};
}

/* -------------------------------------------------------------------------
   Palettes
   ------------------------------------------------------------------------- */
const PALETTES={
  ink:{ bg:"#efe6d2", void:"#efe6d2", floor:"#fbf6ea", wall:"#3a3226",
        corridor:"#e3d3ae", door:"#8c5a2b", stairs:"#2f6b57", prop:"#a8977a",
        grid:"rgba(58,50,38,.10)", label:"#3a3226" },
  blueprint:{ bg:"#12283f", void:"#12283f", floor:"#1b3a58", wall:"#7fc4ff",
        corridor:"#0f2438", door:"#ffd166", stairs:"#6ef3c7", prop:"#4d7ea8",
        grid:"rgba(127,196,255,.13)", label:"#cfe8ff" },
  slate:{ bg:"#15131b", void:"#15131b", floor:"#3b3550", wall:"#0d0b12",
        corridor:"#282338", door:"#c8a2ff", stairs:"#7de0c0", prop:"#5b5478",
        grid:"rgba(255,255,255,.05)", label:"#e8e3f3" },
  mono:{ bg:"#ffffff", void:"#ffffff", floor:"#ffffff", wall:"#111111",
        corridor:"#ffffff", door:"#666666", stairs:"#999999", prop:"#cccccc",
        grid:"rgba(0,0,0,.12)", label:"#111111" },
};

/* -------------------------------------------------------------------------
   Rendering
   ------------------------------------------------------------------------- */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let state=null, view={scale:10, ox:40, oy:40};
let dpr=Math.max(1,window.devicePixelRatio||1);

function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  cv.width=Math.floor(r.width*dpr); cv.height=Math.floor(r.height*dpr);
  draw();
}
window.addEventListener("resize",resize);

function fit(){
  if(!state) return;
  const r=cv.parentElement.getBoundingClientRect();
  const s=Math.min(r.width/(state.W+2), r.height/(state.H+2));
  view.scale=Math.max(2,Math.floor(s*10)/10);
  view.ox=(r.width-state.W*view.scale)/2;
  view.oy=(r.height-state.H*view.scale)/2;
  draw();
}

function draw(){
  if(!state) return;
  const p=PALETTES[state.style]||PALETTES.slate;
  const s=view.scale;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=p.bg;
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save();
  ctx.translate(view.ox,view.oy);

  const {grid,W,H}=state;
  // tile fill
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const t=grid[y*W+x];
    let c=null;
    if(t===T.FLOOR) c=p.floor;
    else if(t===T.WALL) c=p.wall;
    else if(t===T.CORRIDOR) c=p.corridor;
    else if(t===T.DOOR) c=p.door;
    else if(t===T.STAIRS) c=p.stairs;
    else if(t===T.PROP) c=p.prop;
    if(!c) continue;
    ctx.fillStyle=c;
    ctx.fillRect(x*s,y*s,Math.ceil(s),Math.ceil(s));
  }

  // grid lines
  if(state.optGrid && s>=6){
    ctx.strokeStyle=p.grid; ctx.lineWidth=1; ctx.beginPath();
    for(let x=0;x<=W;x++){ ctx.moveTo(Math.round(x*s)+.5,0); ctx.lineTo(Math.round(x*s)+.5,H*s); }
    for(let y=0;y<=H;y++){ ctx.moveTo(0,Math.round(y*s)+.5); ctx.lineTo(W*s,Math.round(y*s)+.5); }
    ctx.stroke();
  }

  // door glyphs
  if(s>=8){
    ctx.strokeStyle=p.bg; ctx.lineWidth=Math.max(1,s*0.14);
    for(const [x,y] of state.doors){
      ctx.beginPath();
      ctx.moveTo(x*s+s*0.18,y*s+s*0.5); ctx.lineTo(x*s+s*0.82,y*s+s*0.5);
      ctx.stroke();
    }
    // stairs glyph
    ctx.lineWidth=Math.max(1,s*0.1);
    for(const [x,y] of state.stairs){
      for(let k=0;k<3;k++){
        ctx.beginPath();
        ctx.moveTo(x*s+s*0.2, y*s+s*(0.28+k*0.22));
        ctx.lineTo(x*s+s*0.8, y*s+s*(0.28+k*0.22));
        ctx.stroke();
      }
    }
  }

  // room labels
  if(state.optLabels){
    ctx.fillStyle=p.label;
    ctx.font=`${Math.max(9,s*0.9)}px ui-sans-serif,system-ui,sans-serif`;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    state.rooms.forEach((r,i)=>{
      ctx.fillText(String(i+1), (r.x+r.w/2)*s, (r.y+r.h/2)*s);
    });
  }

  ctx.restore();
}

/* pan + zoom */
let dragging=false, lx=0, ly=0;
cv.addEventListener("pointerdown",e=>{dragging=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",e=>{
  if(!dragging) return;
  view.ox+=e.clientX-lx; view.oy+=e.clientY-ly; lx=e.clientX; ly=e.clientY; draw();
});
cv.addEventListener("pointerup",()=>dragging=false);
cv.addEventListener("pointercancel",()=>dragging=false);
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const before={x:(mx-view.ox)/view.scale, y:(my-view.oy)/view.scale};
  const f=e.deltaY<0?1.12:1/1.12;
  view.scale=Math.min(64,Math.max(2,view.scale*f));
  view.ox=mx-before.x*view.scale; view.oy=my-before.y*view.scale;
  draw();
},{passive:false});

/* -------------------------------------------------------------------------
   UI wiring
   ------------------------------------------------------------------------- */
const $=id=>document.getElementById(id);
const SLIDERS=["w","h","rooms","rsize","rvar","cw","loops"];
function syncLabels(){
  $("wV").textContent=$("w").value+" tiles";
  $("hV").textContent=$("h").value+" tiles";
  $("roomsV").textContent=$("rooms").value;
  $("rsizeV").textContent=$("rsize").value;
  $("rvarV").textContent="±"+$("rvar").value;
  $("cwV").textContent=$("cw").value;
  $("loopsV").textContent=$("loops").value;
}
SLIDERS.forEach(id=>$(id).addEventListener("input",()=>{syncLabels();regen();}));
["style","optDoors","optStairs","optProps","optGrid","optLabels"].forEach(id=>
  $(id).addEventListener("change",()=>{ applyStyle(); draw(); }));

function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600);
}

function applyStyle(){
  if(!state) return;
  state.style=$("style").value;
  state.optGrid=$("optGrid").checked;
  state.optLabels=$("optLabels").checked;
}

function readOpts(){
  return {
    W:+$("w").value, H:+$("h").value,
    roomCount:+$("rooms").value, roomSize:+$("rsize").value, roomVar:+$("rvar").value,
    corridorW:+$("cw").value, loops:+$("loops").value,
    seed:$("seed").value.trim()||"delve",
  };
}

function regen(){
  const opts=readOpts();
  const t0=performance.now();
  const g=generate(opts);
  const genMs=performance.now()-t0;
  const style=$("style").value;
  const prev=state;
  state=Object.assign(g,{
    style,
    optGrid:$("optGrid").checked,
    optLabels:$("optLabels").checked,
  });
  // doors/stairs/props honour their checkboxes by simply not drawing them
  if(!$("optDoors").checked) state.doors=[];
  if(!$("optStairs").checked) state.stairs=[];
  if(!$("optProps").checked){
    for(const [x,y] of g.props) g.grid[y*g.W+x]=T.FLOOR;
    state.props=[];
  }
  if(!prev) fit(); else draw();
  $("sRooms").textContent=state.rooms.length;
  $("sTiles").textContent=state.walkable.toLocaleString();
  $("sDoors").textContent=state.doors.length;
  $("msTag").textContent="gen "+genMs.toFixed(2)+" ms · "+state.W+"×"+state.H;
}

$("gen").addEventListener("click",()=>{ regen(); toast("Generated "+state.seed); });
$("randomize").addEventListener("click",()=>{ $("seed").value=randomSeed(); regen(); });
$("seed").addEventListener("change",()=>regen());
$("copySeed").addEventListener("click",async()=>{
  try{ await navigator.clipboard.writeText($("seed").value); toast("Seed copied"); }
  catch(_){ $("seed").select(); document.execCommand("copy"); toast("Seed copied"); }
});

/* ---- exports ---- */
function download(blobOrUrl,name){
  const a=document.createElement("a");
  a.href=blobOrUrl; a.download=name; document.body.appendChild(a); a.click(); a.remove();
}
function safeName(){ return String(state.seed).replace(/[^\w.-]+/g,"_").slice(0,48); }

function exportPNG(mult){
  const s=12*mult, W=state.W, H=state.H;
  const p=PALETTES[state.style];
  const c=document.createElement("canvas");
  c.width=W*s; c.height=H*s;
  const x=c.getContext("2d");
  x.fillStyle=p.bg; x.fillRect(0,0,c.width,c.height);
  const g=state.grid;
  for(let yy=0;yy<H;yy++) for(let xx=0;xx<W;xx++){
    const t=g[yy*W+xx];
    let col=t===T.FLOOR?p.floor:t===T.WALL?p.wall:t===T.CORRIDOR?p.corridor:
            t===T.DOOR?p.door:t===T.STAIRS?p.stairs:t===T.PROP?p.prop:null;
    if(!col) continue;
    x.fillStyle=col; x.fillRect(xx*s,yy*s,s,s);
  }
  if(state.optGrid && mult>=1){
    x.strokeStyle=p.grid; x.lineWidth=1; x.beginPath();
    for(let i=0;i<=W;i++){ x.moveTo(i*s+.5,0); x.lineTo(i*s+.5,H*s); }
    for(let i=0;i<=H;i++){ x.moveTo(0,i*s+.5); x.lineTo(W*s,i*s+.5); }
    x.stroke();
  }
  download(c.toDataURL("image/png"), `delve-${safeName()}-${W}x${H}${mult>1?"@"+mult+"x":""}.png`);
  toast("PNG exported");
}
$("png").addEventListener("click",()=>exportPNG(1));
$("png2").addEventListener("click",()=>exportPNG(2));

function tilesArray(){
  const out=[]; const {grid,W,H}=state;
  for(let y=0;y<H;y++){ const row=[]; for(let x=0;x<W;x++) row.push(grid[y*W+x]); out.push(row); }
  return out;
}
$("json").addEventListener("click",()=>{
  const payload={
    generator:"delve", version:1, seed:state.seed,
    width:state.W, height:state.H,
    legend:{0:"void",1:"floor",2:"wall",3:"corridor",4:"door",5:"stairs",6:"prop"},
    rooms:state.rooms.map((r,i)=>({id:i,x:r.x,y:r.y,w:r.w,h:r.h})),
    doors:state.doors, stairs:state.stairs,
    tiles:tilesArray(),
  };
  download(URL.createObjectURL(new Blob([JSON.stringify(payload)],{type:"application/json"})),
           `delve-${safeName()}.json`);
  toast("Tiles JSON exported");
});
$("csv").addEventListener("click",()=>{
  const csv=tilesArray().map(r=>r.join(",")).join("\n");
  download(URL.createObjectURL(new Blob([csv],{type:"text/csv"})),
           `delve-${safeName()}.csv`);
  toast("Tiles CSV exported");
});

/* keyboard: space = regenerate with same seed, r = random seed */
window.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  if(e.code==="Space"){ e.preventDefault(); regen(); }
  if(e.key==="r"||e.key==="R"){ $("seed").value=randomSeed(); regen(); }
  if(e.key==="f"||e.key==="F") fit();
});

/* boot */
$("seed").value=randomSeed();
syncLabels();
resize();
regen();
setTimeout(fit,30);
</script>
</body>
</html>
